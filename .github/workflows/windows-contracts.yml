name: Windows component contracts
on:
  pull_request:
    paths: ["**/*.py", "**/pyproject.toml", ".github/workflows/windows-contracts.yml"]
  push:
    paths: ["**/*.py", "**/pyproject.toml", ".github/workflows/windows-contracts.yml"]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: beta-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install component and test tools
        run: python -m pip install -e "." pytest
      - name: Run existing Windows contracts
        run: python -X utf8 -m pytest tests -q --junitxml=windows-contracts.xml
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-contract-results
          path: beta-1/windows-contracts.xml
          retention-days: 7
