<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">Station delivery architecture</title><desc id="d">Private capture is independent of live SRT delivery to CivicCast and completed recording uploads to YouTube.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#006b64"/></marker></defs><path d="M280,75L350,75" fill="none" stroke="#006b64" stroke-width="2" marker-end="url(#a)"/><path d="M610,75L680,75" fill="none" stroke="#006b64" stroke-width="2" marker-end="url(#a)"/><path d="M810,120L480,190" fill="none" stroke="#006b64" stroke-width="2" marker-end="url(#a)"/><path d="M610,235L680,235" fill="none" stroke="#006b64" stroke-width="2" marker-end="url(#a)"/><path d="M810,120L480,350" fill="none" stroke="#006b64" stroke-width="2" marker-end="url(#a)"/><path d="M610,395L680,395" fill="none" stroke="#006b64" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="30" width="260" height="90" rx="7" fill="#f1f6f5" stroke="#006b64"/><text x="34" y="62" font-family="Arial" font-size="18" font-weight="bold" fill="#182f3a">Chamber input</text><text x="34" y="90" font-family="Arial" font-size="13" fill="#526775">Configured live MPEG-TS</text><rect x="350" y="30" width="260" height="90" rx="7" fill="#f1f6f5" stroke="#006b64"/><text x="364" y="62" font-family="Arial" font-size="18" font-weight="bold" fill="#182f3a">Station capture</text><text x="364" y="90" font-family="Arial" font-size="13" fill="#526775">Independent recording pipeline</text><rect x="680" y="30" width="260" height="90" rx="7" fill="#f1f6f5" stroke="#006b64"/><text x="694" y="62" font-family="Arial" font-size="18" font-weight="bold" fill="#182f3a">Private evidence</text><text x="694" y="90" font-family="Arial" font-size="13" fill="#526775">Growing TS → verified recording</text><rect x="350" y="190" width="260" height="90" rx="7" fill="#f1f6f5" stroke="#006b64"/><text x="364" y="222" font-family="Arial" font-size="18" font-weight="bold" fill="#182f3a">Isolated live sender</text><text x="364" y="250" font-family="Arial" font-size="13" fill="#526775">Encrypted SRT; bounded buffers</text><rect x="680" y="190" width="260" height="90" rx="7" fill="#f1f6f5" stroke="#006b64"/><text x="694" y="222" font-family="Arial" font-size="18" font-weight="bold" fill="#182f3a">Separate CivicCast</text><text x="694" y="250" font-family="Arial" font-size="13" fill="#526775">PEG operator controls cable</text><rect x="350" y="350" width="260" height="90" rx="7" fill="#f1f6f5" stroke="#006b64"/><text x="364" y="382" font-family="Arial" font-size="18" font-weight="bold" fill="#182f3a">Approved upload queue</text><text x="364" y="410" font-family="Arial" font-size="13" fill="#526775">Separate worker; MP4 remux</text><rect x="680" y="350" width="260" height="90" rx="7" fill="#f1f6f5" stroke="#006b64"/><text x="694" y="382" font-family="Arial" font-size="18" font-weight="bold" fill="#182f3a">YouTube recording</text><text x="694" y="410" font-family="Arial" font-size="13" fill="#526775">Explicit visibility and receipt</text></svg>