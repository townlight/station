<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Townlight portal architecture</title><desc id="desc">Private Meetings, Station and Records feed a native bridge. A private approved bundle flows to the separately deployed portal, which serves residents through a TLS proxy.</desc><rect width="1200" height="430" fill="#f1f6f5"/><g font-family="Segoe UI,Arial" fill="#182f3a"><text x="45" y="48" font-size="25" font-weight="700">Private staff environment</text><text x="640" y="48" font-size="25" font-weight="700">Separate portal deployment</text><g fill="#fff" stroke="#006b64" stroke-width="3"><rect x="45" y="80" width="235" height="85" rx="8"/><rect x="45" y="180" width="235" height="85" rx="8"/><rect x="45" y="280" width="235" height="85" rx="8"/><rect x="340" y="155" width="230" height="135" rx="8"/><rect x="650" y="105" width="230" height="130" rx="8"/><rect x="650" y="270" width="230" height="95" rx="8"/><rect x="945" y="155" width="210" height="135" rx="8"/></g><g font-size="20" text-anchor="middle"><text x="162" y="130">Meetings archive</text><text x="162" y="230">Station recording</text><text x="162" y="330">Records release</text><text x="455" y="205">Native bridge</text><text x="455" y="235" font-size="15">approval + proof + checks</text><text x="765" y="155">Wagtail portal</text><text x="765" y="185" font-size="15">city pages + public archive</text><text x="765" y="315">Private release files</text><text x="1050" y="205">TLS reverse proxy</text><text x="1050" y="235" font-size="15">city services + meetings</text></g><g fill="none" stroke="#006b64" stroke-width="4" marker-end="url(#arrow)"><path d="M280 122 H310 V190 H340"/><path d="M280 222 H340"/><path d="M280 322 H310 V255 H340"/><path d="M570 220 H650"/><path d="M765 235 V270"/><path d="M880 180 H945"/></g><text x="605" y="205" font-size="14" text-anchor="middle">private ZIP</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006b64"/></marker></defs></svg>
