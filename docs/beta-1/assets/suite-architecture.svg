<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Townlight Suite architecture</title><desc id="desc">Native desktop and canonical domain services; Station remains a separate configured boundary.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#006b64"/></marker></defs><path d="M280,75 L350,75" stroke="#006b64" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M610,75 L680,75" stroke="#006b64" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M810,123 L810,204" stroke="#006b64" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M750,123 L560,204" stroke="#006b64" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M350,250 L280,250" stroke="#006b64" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="20" y="28" width="260" height="95" rx="5" fill="#f1f6f5" stroke="#9bbab7"/><text x="36" y="64" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#182f3a">Staff desktop</text><text x="36" y="91" font-family="Arial,sans-serif" font-size="13" fill="#526775">Eight product workspaces</text><rect x="350" y="28" width="260" height="95" rx="5" fill="#f1f6f5" stroke="#9bbab7"/><text x="366" y="64" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#182f3a">Native Rust and Tauri</text><text x="366" y="91" font-family="Arial,sans-serif" font-size="13" fill="#526775">Session and fixed IPC</text><rect x="680" y="28" width="260" height="95" rx="5" fill="#f1f6f5" stroke="#9bbab7"/><text x="696" y="64" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#182f3a">Python domain runtime</text><text x="696" y="91" font-family="Arial,sans-serif" font-size="13" fill="#526775">Canonical business rules</text><rect x="680" y="204" width="260" height="95" rx="5" fill="#f1f6f5" stroke="#9bbab7"/><text x="696" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#182f3a">PostgreSQL and files</text><text x="696" y="267" font-family="Arial,sans-serif" font-size="13" fill="#526775">Saved work and originals</text><rect x="350" y="204" width="260" height="95" rx="5" fill="#f1f6f5" stroke="#9bbab7"/><text x="366" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#182f3a">Station API and worker</text><text x="366" y="267" font-family="Arial,sans-serif" font-size="13" fill="#526775">Separate database and media</text><rect x="20" y="204" width="260" height="95" rx="5" fill="#f1f6f5" stroke="#9bbab7"/><text x="36" y="240" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#182f3a">Records release workflow</text><text x="36" y="267" font-family="Arial,sans-serif" font-size="13" fill="#526775">Decision then approval</text><text x="20" y="329" font-family="Arial,sans-serif" font-size="12" fill="#526775">Native desktop and canonical domain services; Station remains a separate configured boundary.</text></svg>