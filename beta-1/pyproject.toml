[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "townlight-station"
version = "0.3.0"
description = "Independent Townlight Station service using the pinned CivicCast media implementation"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "UI-THIRD-PARTY-LICENSES.txt"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "sqlalchemy>=2,<3", "psycopg2-binary>=2.9,<3", "pydantic>=2,<3", "pywin32>=311; sys_platform == 'win32'"]

[project.scripts]
townlight-station = "townlight_station.cli:main"

[tool.setuptools.package-data]
townlight_station = ["media-lock.json", "ui/*.html", "ui/*.css", "ui/*.js"]

[tool.setuptools.packages.find]
include = ["townlight_station*"]
