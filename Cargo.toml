[workspace]
resolver = "3"
members = [
    "bins/channel-worker",
    "bins/station-updater",
    "bins/stationd",
    "crates/station-api",
    "crates/station-alerting",
    "crates/station-auth",
    "crates/station-cg",
    "crates/station-captions",
    "crates/station-domain",
    "crates/station-media-journal",
    "crates/station-media-lifecycle",
    "crates/station-media-engine",
    "crates/station-ingest",
    "crates/station-media-assets",
    "crates/station-media-protocol",
    "crates/station-maintenance",
    "crates/station-orchestration",
    "crates/station-publishing",
    "crates/station-runtime",
    "crates/station-readiness",
    "crates/station-schedule",
    "crates/station-live",
    "crates/station-feed-normalization",
    "crates/station-feed-fetch",
    "crates/station-support",
    "crates/station-storage",
    "crates/station-update",
    "crates/station-update-coordinator",
    "crates/station-windows-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
argon2 = "=0.5.3"
base64 = "=0.23.1"
ed25519-dalek = "=2.2.0"
gstreamer = { version = "=0.25.3", features = ["v1_28"] }
gstreamer-pbutils = { version = "=0.25.2", features = ["v1_28"] }
gdk-pixbuf = "=0.22.0"
getrandom = "=0.4.3"
hmac = "=0.12.1"
jiff = "=0.2.28"
lettre = "=0.11.23"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
semver = "=1.0.28"
sha2 = "=0.10.9"
subtle = "=2.6.1"
quick-xml = "=0.41.0"
url = "=2.5.8"
httpdate = "=1.0.3"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
station-api = { path = "crates/station-api" }
station-alerting = { path = "crates/station-alerting" }
station-auth = { path = "crates/station-auth" }
station-cg = { path = "crates/station-cg" }
station-captions = { path = "crates/station-captions" }
station-domain = { path = "crates/station-domain" }
station-media-journal = { path = "crates/station-media-journal" }
station-media-lifecycle = { path = "crates/station-media-lifecycle" }
station-media-engine = { path = "crates/station-media-engine" }
station-ingest = { path = "crates/station-ingest" }
station-media-assets = { path = "crates/station-media-assets" }
station-live = { path = "crates/station-live" }
station-media-protocol = { path = "crates/station-media-protocol" }
station-maintenance = { path = "crates/station-maintenance" }
station-orchestration = { path = "crates/station-orchestration" }
station-publishing = { path = "crates/station-publishing" }
station-runtime = { path = "crates/station-runtime" }
station-readiness = { path = "crates/station-readiness" }
station-schedule = { path = "crates/station-schedule" }
station-feed-normalization = { path = "crates/station-feed-normalization" }
station-feed-fetch = { path = "crates/station-feed-fetch" }
station-support = { path = "crates/station-support" }
station-storage = { path = "crates/station-storage" }
station-update = { path = "crates/station-update" }
station-update-coordinator = { path = "crates/station-update-coordinator" }
station-windows-ipc = { path = "crates/station-windows-ipc" }
ureq = { version = "=3.4.0", features = ["platform-verifier"] }
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }
zip = { version = "=8.6.0", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
