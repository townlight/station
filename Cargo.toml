[workspace]
resolver = "3"
members = [
    "bins/channel-worker",
    "bins/stationd",
    "crates/station-api",
    "crates/station-domain",
    "crates/station-media-journal",
    "crates/station-media-engine",
    "crates/station-media-assets",
    "crates/station-media-protocol",
    "crates/station-runtime",
    "crates/station-schedule",
    "crates/station-storage",
    "crates/station-windows-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gstreamer = { version = "=0.25.3", features = ["v1_28"] }
gstreamer-pbutils = { version = "=0.25.2", features = ["v1_28"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
station-api = { path = "crates/station-api" }
station-domain = { path = "crates/station-domain" }
station-media-journal = { path = "crates/station-media-journal" }
station-media-engine = { path = "crates/station-media-engine" }
station-media-assets = { path = "crates/station-media-assets" }
station-media-protocol = { path = "crates/station-media-protocol" }
station-runtime = { path = "crates/station-runtime" }
station-schedule = { path = "crates/station-schedule" }
station-storage = { path = "crates/station-storage" }
station-windows-ipc = { path = "crates/station-windows-ipc" }
windows-service = "=0.8.1"

[profile.release]
lto = "thin"
strip = "symbols"
